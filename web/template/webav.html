                pct: document.getElementById('lgPct'),
                on: false, done: false, disp: 4, target: null, wantPlay: false,
                raf: 0, pendT: null, finT: null,
                headAng: -Math.PI / 2, trail: [], foodAng: null, eats: 0, parts: [], last: 0
            };
            const lgCtx = lg.cvs.getContext('2d');
            function lgResize(){
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                lg.cvs.width = 150 * dpr; lg.cvs.height = 150 * dpr;
                lgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            function bufferedAheadOf(t){
                try {
                    const b = video.buffered;
                    for (let i = 0; i < b.length; i++) {
                        if (t >= b.start(i) - 0.4 && t <= b.end(i) + 0.4) return b.end(i);
                    }
                } catch(e){}
                return 0;
            }
            function lgRealPct(){
                if (video.readyState >= 3) return 100;
                const T = (lg.target != null) ? lg.target : video.currentTime;
                const end = bufferedAheadOf(T);
                if (end <= T) return 0;
                return Math.max(0, Math.min(100, ((end - T) / 15) * 100));
            }
            function lgSnakeReset(){
                lgResize();
                lg.headAng = -Math.PI / 2;
                lg.trail = []; lg.parts = []; lg.eats = 0;
                lg.foodAng = lg.headAng + 0.9;
            }
            function lgDraw(dt, now){
                const ctx = lgCtx, C = 75, R = 58, TAU = Math.PI * 2;
                ctx.clearRect(0, 0, 150, 150);
                // ট্র্যাক সার্কেল
                ctx.beginPath(); ctx.arc(C, C, R, 0, TAU);
                ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2.5; ctx.stroke();
                // প্রগ্রেস আর্ক
                if (lg.disp > 0.5) {
                    ctx.beginPath(); ctx.arc(C, C, R, -Math.PI / 2, -Math.PI / 2 + (Math.min(lg.disp, 100) / 100) * TAU);
                    ctx.strokeStyle = 'rgba(34,211,238,.85)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.stroke();
                }
                // হেড মুভ (গেমের মতো সবসময় চলতেই থাকে)
                const spd = 2.3;
                lg.headAng += spd * dt;
                const hx = C + Math.cos(lg.headAng) * R, hy = C + Math.sin(lg.headAng) * R;
                lg.trail.push({ x: hx, y: hy });
                const maxSeg = 12 + Math.min(lg.eats * 2, 30);
                while (lg.trail.length > maxSeg) lg.trail.shift();
                // 🍎 খাবার খাওয়া: মুখ ছুঁলেই % লাফ দেয় + পার্টিকেল বিস্ফোরণ
                if (lg.foodAng == null || lg.headAng >= lg.foodAng) {
                    if (lg.foodAng != null) {
                        lg.eats++;
                        const fx = C + Math.cos(lg.foodAng) * R, fy = C + Math.sin(lg.foodAng) * R;
                        for (let i = 0; i < 7; i++) {
                            const a = Math.random() * TAU, s = 14 + Math.random() * 26;
                            lg.parts.push({ x: fx, y: fy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45 });
                        }
                        if (lg.disp < 97) lg.disp = Math.min(97, lg.disp + 0.9);
                        else if (lg.disp < 98.9) lg.disp += 0.25;
                    }
                    lg.foodAng = lg.headAng + 1.1 + Math.random() * 1.6;
                }
                // খাবার আঁকা (পালস করে)
                const fx2 = C + Math.cos(lg.foodAng) * R, fy2 = C + Math.sin(lg.foodAng) * R;
                const pulse = 3.2 + Math.sin(now / 130) * 1.1;
                ctx.beginPath(); ctx.arc(fx2, fy2, pulse + 2.5, 0, TAU);
                ctx.fillStyle = 'rgba(255,93,93,.18)'; ctx.fill();
                ctx.beginPath(); ctx.arc(fx2, fy2, pulse, 0, TAU);
                ctx.fillStyle = '#ff5d5d'; ctx.shadowColor = '#ff5d5d'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
                // সাপের বডি (লেজ → মাথা)
                for (let i = 0; i < lg.trail.length; i++) {
                    const p = lg.trail[i], k = i / lg.trail.length;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 1.2 + k * 3.4, 0, TAU);
                    ctx.fillStyle = 'rgba(45,212,191,' + (0.25 + k * 0.6).toFixed(2) + ')';
                    ctx.fill();
                }
                // সাপের মাথা + চোখ
                ctx.beginPath(); ctx.arc(hx, hy, 5.2, 0, TAU);
                ctx.fillStyle = '#22d3ee'; ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
                const ea = lg.headAng + Math.PI / 2;
                ctx.beginPath();
                ctx.arc(hx + Math.cos(ea) * 2.2, hy + Math.sin(ea) * 2.2, 1.1, 0, TAU);
                ctx.arc(hx - Math.cos(ea) * 2.2, hy - Math.sin(ea) * 2.2, 1.1, 0, TAU);
                ctx.fillStyle = '#062028'; ctx.fill();
                // খাওয়ার পার্টিকেল
                for (let i = lg.parts.length - 1; i >= 0; i--) {
                    const p = lg.parts[i];
                    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
                    if (p.life <= 0) { lg.parts.splice(i, 1); continue; }
                    ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, TAU);
                    ctx.fillStyle = 'rgba(255,180,80,' + (p.life / 0.45).toFixed(2) + ')'; ctx.fill();
                }
            }
            function lgTick(now){
                if (!lg.on) return;
                lg.raf = requestAnimationFrame(lgTick);
                if (!lg.last) lg.last = now;
                const dt = Math.min((now - lg.last) / 1000, 0.05);
                lg.last = now;
                const real = lgRealPct();
                if (real >= 100) {
                    // রেডি → স্প্রিন্ট: দ্রুত ১০০-তে উঠে প্লে
                    lg.disp = Math.min(100, lg.disp + 34 * dt + (100 - lg.disp) * 0.12);
                } else if (lg.disp < 97) {
                    // ⚡ ফাস্ট মোড: ডেটা আসুক বা না আসুক ন্যূনতম ৭%/সেকেন্ডে বাড়বে —
                    // ডেটা এগোলে আরও দ্রুত ফলো করবে — কখনো ০% এ আটকে থাকবে না
                    const follow = Math.max(0, real - lg.disp) * 1.4;
                    lg.disp = Math.min(97, lg.disp + Math.max(7, follow) * dt);
                }
                lgDraw(dt, now);
                lg.pct.textContent = Math.floor(lg.disp) + '%';
                if (lg.disp >= 100 && real >= 100 && !lg.done) {
                    lg.done = true;
                    lg.pct.textContent = 'GO!';
                    lg.pct.classList.add('go');
                    lg.finT = setTimeout(() => {
                        lgHide();
                        if (lg.wantPlay) { lg.wantPlay = false; video.play().catch(()=>{}); }
                    }, 500);
                }
            }
            function lgShow(targetSec, autoplayAfter){
                clearTimeout(lg.finT);
                lg.target = (typeof targetSec === 'number') ? targetSec : null;
                lg.wantPlay = !!autoplayAfter;
                if (lg.on) { lg.done = false; return; }
                lg.on = true; lg.done = false; lg.disp = 4;
                lg.pct.classList.remove('go');
                lgSnakeReset();
                lg.el.classList.add('show');
                lg.last = 0;
                lg.raf = requestAnimationFrame(lgTick);
            }
            function lgHide(){
                if (!lg.on) return;
                lg.on = false;
                cancelAnimationFrame(lg.raf);
                clearTimeout(lg.finT);
                lg.el.classList.remove('show');
                lg.target = null;
            }
            // লোডিং স্ক্রিনে ট্যাপ = বন্ধ করে থামাও
            lg.el.addEventListener('click', () => {
                if (!lg.on || lg.done) return;
                lgHide();
                wantPlayAfterSeek = false;
                try { video.pause(); } catch(e){}
            });
            function lgQueue(target, from){
                clearTimeout(lg.pendT);
                const far = Math.abs(target - from) > 20;
                lg.pendT = setTimeout(() => {
                    if (lg.on || video.paused) return;
                    if (video.readyState >= 3 && !video.seeking) return;
                    lgShow(target, wantPlayAfterSeek);
                    wantPlayAfterSeek = false;
                }, far ? 180 : 420);
            }
            function doSeek(t){
                const from = video.currentTime;
                poster.classList.remove('show');
                t = Math.min(Math.max(t, 0), (video.duration||0) - 1);
                try {
                    if (video.fastSeek && Math.abs(t - video.currentTime) > 3) { video.fastSeek(t); }
                    else { video.currentTime = t; }
                } catch(e){ try { video.currentTime = t; } catch(e2){} }
                if (!video.paused) { wantPlayAfterSeek = true; setStatus('load'); lgQueue(t, from); }
            }
            video.addEventListener('canplay', () => {
                clearTimeout(lg.pendT);
                if (wantPlayAfterSeek && !lg.on) { wantPlayAfterSeek = false; video.play().catch(()=>{}); }
            });
            video.addEventListener('seeked', () => {
                if (wantPlayAfterSeek && !lg.on && video.readyState >= 2) { wantPlayAfterSeek = false; video.play().catch(()=>{}); }
            });

            function seekBy(sec){
                fireStreamAd();
                doSeek(video.currentTime + sec);
                showRipple(sec < 0 ? 'left' : 'right');
                toast((sec < 0 ? '⏪ ' : '⏩ ') + Math.abs(sec) + 's');
                showUI(true);
            }

            /* --- Seek bar --- */
            let seeking = false;
            function seekPos(e){
                const r = seek.querySelector('.mbx-track').getBoundingClientRect();
                const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
                return { p: x / r.width, xPct: (x / r.width) * 100 };
            }
            seek.addEventListener('pointerdown', e => {
                seeking = true; seek.classList.add('dragging');
                try { seek.setPointerCapture(e.pointerId); } catch(err){}
                const s = seekPos(e);
                playedEl.style.width = s.xPct + '%';
                tipEl.style.left = s.xPct + '%';
                tipEl.textContent = fmtTime(s.p * (video.duration||0));
                e.preventDefault();
            });
            seek.addEventListener('pointermove', e => {
                if (!seeking) return;
                const s = seekPos(e);
                playedEl.style.width = s.xPct + '%';
                tipEl.style.left = s.xPct + '%';
                tipEl.textContent = fmtTime(s.p * (video.duration||0));
            });
            function endSeek(e){
                if (!seeking) return;
                seeking = false; seek.classList.remove('dragging');
                const s = seekPos(e);
                fireStreamAd();
                doSeek(s.p * (video.duration||0));
                showUI(true);
            }
            seek.addEventListener('pointerup', endSeek);
            seek.addEventListener('pointercancel', () => { seeking = false; seek.classList.remove('dragging'); });

            /* --- Video events --- */
            video.addEventListener('play', () => {
                setPlayIcons(true); setStatus('play'); showUI(true); tryBoost(); reqWake();
                poster.classList.remove('show');
                // 🔧 START FIX আর্ম: প্রথম প্লেতে ০০:০০ ফ্রিজ হলে কিক দাও
                if (!MBX.kickArmed) { MBX.kickArmed = true; setTimeout(startKick, 1800); }
            });
            video.addEventListener('pause', () => { setPlayIcons(false); setStatus('paused'); clearTimeout(lg.pendT); lgHide(); relWake(); });
            video.addEventListener('waiting', () => {
                if (!video.paused) {
                    setStatus('load');
                    clearTimeout(lg.pendT);
                    lg.pendT = setTimeout(() => {
                        if (!lg.on && !video.paused && video.readyState < 3) { lgShow(video.currentTime, true); wantPlayAfterSeek = false; }
                    }, 600);
                }
            });
            video.addEventListener('playing', () => { setStatus('play'); clearTimeout(lg.pendT); lgHide(); MBX.hasPlayed = true; MBX.errTries = 0; });

            video.addEventListener('timeupdate', () => {
                document.getElementById('tCur').textContent = fmtTime(video.currentTime);
                if (!seeking && video.duration) playedEl.style.width = (video.currentTime / video.duration * 100) + '%';
            });

            video.addEventListener('loadedmetadata', () => {
                document.getElementById('tDur').textContent = fmtTime(video.duration);
                // 🖼️ প্রথম ফ্রেম পোস্টার: মাইক্রো-সিক দিয়ে ফ্রেম-১ আঁকা (অটো-প্লে ছাড়াই)
                try { if (video.currentTime === 0) video.currentTime = 0.001; } catch(e){}
            });
            video.addEventListener('progress', updateBuffered);
            video.addEventListener('timeupdate', updateBuffered);
            function updateBuffered(){
                try {
                    const b = video.buffered;
                    if (b.length && video.duration) {
                        const end = b.end(b.length - 1);
                        buffEl.style.width = (end / video.duration * 100) + '%';
                    }
                } catch(e){}
            }
            /* 🎬 মুভি শেষ: অটোমেটিক ফুলস্ক্রিন ছোট + জমা অ্যাড ফ্লাশের প্রস্তুতি */
            video.addEventListener('ended', () => {
                setPlayIcons(false); setStatus('paused'); showUI(false); lgHide();
                const wasFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
                if (wasFs) {
                    try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch(e){}
                }
                if (pendingAds > 0) armFlush();
            });
            video.addEventListener('error', () => {
                if (typeof RESUME !== 'undefined' && RESUME.busy) return; // resume engine handles it
                lgHide();
                poster.classList.remove('show');
                MBX.posterPainted = false;
                if (MBX.errTries >= 3) { setStatus('paused'); showFallbackBox(); return; }
                MBX.errTries++;
                toast('🔁 আবার চেষ্টা করছি (' + MBX.errTries + '/3)...');
                setTimeout(() => { try { video.load(); video.play().catch(()=>{}); } catch(e){} }, 1500);
            });

            /* --- 🔧 START FIX: ০০:০০ ফ্রিজ কিক (প্রথম প্লেতে একবারই) --- */
            function startKick(){
                if (video.paused || video.ended) return;
                let tries = 0;
                const iv = setInterval(() => {
                    if (video.paused || video.ended || video.currentTime > 0.6) { clearInterval(iv); return; }
                    tries++;
                    if (tries <= 3) {
                        // মাইক্রো-নাজ: স্ট্রিমকে জোর করে সামান্য সামনে নাড়াও
                        try { if (video.currentTime < 0.03) video.currentTime = 0.012 * tries; } catch(e){}
                        video.play().catch(()=>{});
                    } else {
                        clearInterval(iv);
                        const pos = Math.max(video.currentTime, 0.05);
                        try {
                            video.load();
                            video.addEventListener('loadedmetadata', function m(){
                                video.removeEventListener('loadedmetadata', m);
                                try { video.currentTime = pos; } catch(e){}
                                video.play().catch(()=>{});
                            });
                        } catch(e){}
                    }
                }, 1900);
            }

            /* --- জেসচার --- */
            const isUI = (t) => !!(t.closest && (t.closest('.mbx-controls') || t.closest('.mbx-menu') || t.closest('.mbx-center') || t.closest('.mbx-skip') || t.closest('.mbx-loadgame')));
            function showRipple(side){
                const r = document.createElement('div');
                r.className = 'tap-ripple ' + side;
                r.innerHTML = side === 'left' ? '<i class="fa-solid fa-backward"></i>' : '<i class="fa-solid fa-forward"></i>';
                player.appendChild(r);
                setTimeout(() => r.remove(), 500);
            }
            let gX=0, gY=0, gTime=0, gBright=1, gVol=1, gMode=null, gMoved=false, gRect=null;
            let lastTapT=0, lastTapX=0, tapTimer=null;

            player.addEventListener('touchstart', e => {
                if (menu.classList.contains('open') && !e.target.closest('.mbx-menu') && !e.target.closest('#btnSettings')) {
                    menu.classList.remove('open'); return;
                }
                if (isUI(e.target)) { gMode = null; return; }
                gRect = player.getBoundingClientRect();
                gX = e.touches[0].clientX; gY = e.touches[0].clientY;
                gTime = video.currentTime;
                gBright = parseFloat(((video.style.filter||'').match(/brightness\(([^)]+)\)/) || [])[1] || 1);
                gVol = video.muted ? 0 : video.volume;
                gMode = 'pending'; gMoved = false;
            }, { passive: true });

            player.addEventListener('touchmove', e => {
                if (!gMode) return;
                e.preventDefault();
                const dx = e.touches[0].clientX - gX;
                const dy = gY - e.touches[0].clientY;
                if (gMode === 'pending') {
                    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { gMode = 'h'; gMoved = true; }
                    else if (Math.abs(dy) > 12) {
                        gMoved = true;
                        const xin = e.touches[0].clientX - gRect.left;
                        gMode = (xin < gRect.width/2) ? 'bright' : 'vol';
                    }
                }
                if (gMode === 'h') {
                    const secs = Math.round(dx / 10);
                    const tgt = Math.min(Math.max(gTime + secs, 0), (video.duration||0) - 1);
                    toast((secs >= 0 ? '⏩ +' : '⏪ ') + Math.abs(secs) + 's → ' + fmtTime(tgt), 30000);
                } else if (gMode === 'bright') {
                    const nb = Math.min(Math.max(gBright + dy/800, 0.35), 2);
                    video.style.filter = 'brightness(' + nb + ')';
                    toast('🔆 Brightness: ' + Math.round(nb*100) + '%', 30000);
                } else if (gMode === 'vol') {
                    const nv = Math.min(Math.max(gVol + dy/600, 0), 1);
                    video.volume = nv; video.muted = nv === 0; updateMuteIcon();
                    toast('🔊 Volume: ' + Math.round(nv*100) + '%', 30000);
                }
            }, { passive: false });

            player.addEventListener('touchend', e => {
                if (gMode === 'h') {
                    const dx = e.changedTouches[0].clientX - gX;
                    const secs = Math.round(dx / 10);
                    fireStreamAd();
                    doSeek(gTime + secs);
                    toast('⏭️ ' + fmtTime(Math.min(Math.max(gTime + secs, 0), (video.duration||0) - 1)));
                    gMode = null; setTimeout(() => gMoved = false, 80);
                    return;
                }
                gMode = null;
                if (gMoved) { gMoved = false; return; }
                if (isUI(e.target)) return;

                const now = Date.now();
                const rect = player.getBoundingClientRect();
                const x = e.changedTouches[0].clientX - rect.left;
                if (now - lastTapT < 300 && Math.abs(x - lastTapX) < 80) {
                    clearTimeout(tapTimer); lastTapT = 0;
                    const w3 = rect.width / 3;
                    if (x < w3) { seekBy(-10); }
                    else if (x > rect.width - w3) { seekBy(10); }
                    else { togglePlay(); }
                } else {
                    lastTapT = now; lastTapX = x;
                    tapTimer = setTimeout(() => toggleUI(), 260);
                }
            }, { passive: true });
            player.addEventListener('touchcancel', () => { gMode = null; });

            player.addEventListener('click', e => {
                if (e.pointerType === 'touch') return;
                if (isUI(e.target)) return;
                toggleUI();
            });

            /* PC: কীবোর্ড */
            document.addEventListener('keydown', e => {
                if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
                if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
                else if (e.code === 'ArrowLeft') seekBy(-10);
                else if (e.code === 'ArrowRight') seekBy(10);
                else if (e.key.toLowerCase() === 'f') toggleFull();
                else if (e.key.toLowerCase() === 'm') { video.muted = !video.muted; updateMuteIcon(); }
            });

            /* --- Wake Lock --- */
            let wakeLock = null;
            async function reqWake(){ try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
            function relWake(){ try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch(e){ wakeLock = null; } }
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !video.paused) reqWake(); });

            /* --- ঘোরালে অটো-ফুলস্ক্রিন --- */
            window.addEventListener('orientationchange', () => {
                setTimeout(() => {
                    const land = (screen.orientation && screen.orientation.type) ? screen.orientation.type.includes('landscape') : (innerWidth > innerHeight);
                    if (land && !video.paused && !isFs()) toggleFull();
                }, 300);
            });

            /* --- স্মার্ট ওয়াচডগ (ফ্রিজ রিকভারি) --- */
            function hasBufferAhead(t){
                try { const b = video.buffered;
                    for (let i=0;i<b.length;i++){ if (t >= b.start(i)-0.5 && t < b.end(i)-0.5) return true; }
                } catch(e){}
                return false;
            }
            let lastT = 0, stuck = 0, lastReload = 0, noBuf = 0;
            setInterval(() => {
                if (video.paused || video.ended || video.seeking || !MBX.hasPlayed) return;
                const t = video.currentTime;
                const frozen = Math.abs(t - lastT) < 0.1;
                lastT = t;
                if (!frozen) { stuck = 0; noBuf = 0; return; }
                if (hasBufferAhead(t)) {
                    noBuf = 0;
                    stuck++;
                    if (stuck === 2) { try { video.currentTime = t + 0.3; } catch(e){} toast('🔄 নিজে নিজে ঠিক করছি...'); }
                    else if (stuck >= 5) {
                        stuck = 0;
                        if (Date.now() - lastReload > 30000) {
                            lastReload = Date.now();
                            const pos = t;
                            try {
                                video.load();
                                video.addEventListener('loadedmetadata', function m(){
                                    video.removeEventListener('loadedmetadata', m);
                                    doSeek(pos);
                                });
                            } catch(e){}
                        }
                    }
                } else if (video.readyState < 3) {
                    // 🔌 জমে আছে + বাফারও নেই = কানেকশন মরে গেছে → একবার নিয়ন্ত্রিত রিফ্রেশ
                    noBuf++;
                    if (noBuf >= 3 && !RESUME.busy && RESUME.fails < 3 && Date.now() - lastReload > 30000) {
                        noBuf = 0; lastReload = Date.now(); RESUME.fails++;
                        resumeConn(true);
                    }
                } else {
                    noBuf = 0;
                }
            }, 2000);

            /* ============================================================
               ⏸️▶️ PAUSE-RESUME ENGINE (ন্যূনতম প্যাচ — বাকি সব অরিজিনাল)
               সমস্যা: লম্বা পজের পর প্লে চাপলে ব্রাউজার মৃত কানেকশনে
               ৫-৬ মিনিট ঝুলে থাকত।
               নিয়ম:
               - পজ থাকা অবস্থায় কিছুই করে না (কোনো টাইমার/রিফ্রেশ নেই —
                 বর্তমান ফ্রেম/পোস্টার স্ক্রিনেই থাকে)
               - ৩০ সেকেন্ডের কম পজ = সরাসরি প্লে (রিফ্রেশ ছাড়াই, সঙ্গে সঙ্গে)
               - ৩০-৫৫ সেকেন্ড পজ = বাফার ৮ সেকেন্ডের কম হলে একবার রিফ্রেশ
               - ৫৫ সেকেন্ডের বেশি পজ = প্লে চাপলে একবার রিফ্রেশ,
                 ঠিক পজিশন থেকেই প্লে হয়
               - রিফ্রেশ একবারই — লুপ নেই; ব্যর্থ হলে সর্বোচ্চ ৩ বার চেষ্টা,
                 তারপর স্পষ্ট বার্তা। কখনো নিজে থেকে পেজ রিলোড হয় না।
               ============================================================ */
            const RESUME = { busy: false, pausedAt: 0, fails: 0, userPaused: false, freshUntil: 0, src: video.src, lastPos: 0 };
            const KICK_AFTER = 55000, KICK_AFTER_BUF = 30000, KICK_BUF_MIN = 8;
            video.addEventListener('pause', () => {
                if (RESUME.busy) { RESUME.userPaused = true; return; }
                RESUME.pausedAt = Date.now();
            });
            video.addEventListener('playing', () => { RESUME.pausedAt = 0; RESUME.fails = 0; });
            video.addEventListener('ended', () => { RESUME.pausedAt = 0; });
            video.addEventListener('timeupdate', () => { if (!video.paused) RESUME.lastPos = video.currentTime; });
            video.addEventListener('play', () => {
                if (RESUME.busy || video.ended) return;
                if (Date.now() < RESUME.freshUntil) return; // সদ্য রিফ্রেশ হয়েছে → সরাসরি প্লে
                const pausedFor = RESUME.pausedAt ? (Date.now() - RESUME.pausedAt) : 0;
                if (pausedFor < KICK_AFTER_BUF) return; // ছোট পজ → সরাসরি প্লে
                const ahead = bufferedAheadOf(video.currentTime) - video.currentTime;
                if (pausedFor < KICK_AFTER && ahead >= KICK_BUF_MIN) return; // বাফার আছে → সরাসরি প্লে
                resumeConn(true);
            });
            function resumeConn(autoplay){
                if (RESUME.busy) return;
                RESUME.busy = true; RESUME.userPaused = false;
                const pos = (video.currentTime > 0.5 ? video.currentTime : (RESUME.lastPos || 0));
                const rate = video.playbackRate;
                const cleanup = () => {
                    video.removeEventListener('loadedmetadata', onMeta);
                    video.removeEventListener('canplay', onCan);
                    video.removeEventListener('error', onErr);
                };
                const giveUp = (msg) => {
                    cleanup(); clearTimeout(deadT);
                    RESUME.busy = false;
                    setPlayIcons(false); setStatus('paused');
                    toast(msg, 4500);
                };
                const onMeta = () => {
                    if (!RESUME.busy) { cleanup(); return; }
                    try { if (pos > 0.5 && pos < (video.duration || Infinity) - 2) video.currentTime = pos; } catch(e){}
                    try { video.playbackRate = rate; } catch(e){}
                };
                const onCan = () => {
                    if (!RESUME.busy) { cleanup(); return; }
                    cleanup(); clearTimeout(deadT);
                    RESUME.busy = false; RESUME.fails = 0; RESUME.pausedAt = 0;
                    RESUME.freshUntil = Date.now() + 60000;
                    if (autoplay && !RESUME.userPaused) {
                        video.play().catch(()=>{});
                    } else {
                        RESUME.pausedAt = Date.now();
                        setPlayIcons(false); setStatus('paused');
                    }
                };
                const onErr = () => {
                    if (!RESUME.busy) { cleanup(); return; }
                    cleanup(); clearTimeout(deadT);
                    RESUME.fails++;
                    RESUME.busy = false;
                    if (RESUME.fails <= 2) { setTimeout(() => { try { resumeConn(autoplay); } catch(e){} }, 2500); }
                    else giveUp('⚠️ কানেকশন পাওয়া যাচ্ছে না — পেজ রিফ্রেশ করে আবার চেষ্টা করুন');
                };
                const deadT = setTimeout(() => {
                    if (RESUME.busy) giveUp('⚠️ খুব ধীর হচ্ছে — আবার প্লে চাপুন');
                }, 75000);
                try {
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                    video.src = RESUME.src;
                    video.load();
                } catch(e) { RESUME.busy = false; }
                setStatus('load');
                toast('🔄 কানেকশন রিফ্রেশ করছি — ঠিক জায়গা থেকেই চলবে…', 5000);
                if (pos > 3) lgShow(pos, autoplay);
                video.addEventListener('loadedmetadata', onMeta);
                video.addEventListener('canplay', onCan);
                video.addEventListener('error', onErr);
            }
            window.MBXResume = { kick: () => resumeConn(true), state: RESUME };

            /* --- ⏸️ NO AUTOPLAY: ভলিউম প্রস্তুত, প্লে ইউজারের হাতে --- */
            try {
                const sv = parseFloat(localStorage.getItem('mbx_vol'));
                if (!isNaN(sv) && sv > 0) video.volume = Math.min(sv, 1);
                else video.volume = 0.9;
            } catch(e){ video.volume = 0.9; }
            video.muted = false;
            updateMuteIcon();
            showUI(true);

            function tryBoost(){
                if (window.audioBoosted || video.muted) return;
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AC();
                    if (ctx.state === 'suspended') ctx.resume();
                    const src = ctx.createMediaElementSource(video);
                    const gain = ctx.createGain();
                    gain.gain.value = 4;
                    src.connect(gain); gain.connect(ctx.destination);
                    window.audioBoosted = true;
                } catch(e){}
            }
        }

        /* ============================================================
           🎯 স্মার্ট নোটিস — সাইজ দেখে ইউজারকে সঠিক পথ দেখাও
        ============================================================ */
        (function(){
            if (CONFIG.smartNotice === false) return;
            try {
                const m = "{{ file_size }}".match(/([\d.]+)\s*(KB|MB|GB|TB)/i);
                if (!m) return;
                const v = parseFloat(m[1]);
                const u = m[2].toUpperCase();
                const isBig = (u === 'GB' && v >= 2) || (u === 'TB');
                const card = document.querySelector('.main-container .glass-card.text-center');
                if (!card) return;

                const box = document.createElement('div');
                if (isBig) {
                    box.className = 'smart-notice';
                    box.innerHTML = '⚠️ <b>বড় ফাইল (2GB+)!</b><br>স্মুথ এক্সপেরিয়েন্সের জন্য ডাউনলোড করতে উপরের <b>✈️ GET FILE</b> বাটন ব্যবহার করুন — টেলিগ্রামে সরাসরি <b>ফুল স্পিড</b> ডাউনলোড হবে।<br>স্ট্রিমিংয়ে সিক দিলে সাপ-গেম লোডিং দেখাবে 🐍 — ১০০% হলেই প্লে হবে। 🙏';
                } else {
                    box.className = 'smart-notice good';
                    box.innerHTML = '✅ <b>এই ফাইলটি আরামসে স্ট্রিম করা যাবে!</b><br>চাইলে <b>⚡ HIGH SPEED DOWNLOAD</b> দিয়ে সরাসরি ডাউনলোডও করতে পারেন। 🎬';
                }
                card.insertAdjacentElement('afterend', box);
            } catch(e){}
        })();

        function toggleEyeCare(){
            const o = document.getElementById('eyeCareOverlay');
            o.style.display = (o.style.display === 'block') ? 'none' : 'block';
        }
        function play_intent(pkg){
            let url = '{{ file_url }}'.replace("http://", "https://");
            window.location.href = `intent:${url}#Intent;package=${pkg};type=video/*;end`;
        }
        function play_system(){
            let url = '{{ file_url }}'.replace("http://", "https://");
            window.location.href = `intent:${url}#Intent;action=android.intent.action.VIEW;type=video/*;end`;
        }

        try { initPlayer(); } catch(e) { console.log("Player init error:", e); }

        /* ============================================================
           🎯 ADSTERRA INTERSTITIAL GUARD
           - ৬ ঘণ্টা কুলডাউন (localStorage: mbx_intl_time)
           - পেজ লোডের ১০ সেকেন্ড পর
           - ভিডিও চলার সময় কখনো না (v.paused চেক)
        ============================================================ */
        (function(){
            try {
                const KEY = 'mbx_intl_time', CD = 6 * 60 * 60 * 1000;
                const last = parseInt(localStorage.getItem(KEY) || '0') || 0;
                if (Date.now() - last < CD) return;
                setTimeout(function tryInject(){
                    try {
                        const v = (typeof MBX !== 'undefined' && MBX.video) ? MBX.video : null;
                        if (v && !v.paused) { setTimeout(tryInject, 6000); return; }
                        localStorage.setItem(KEY, String(Date.now()));
                        const s = document.createElement('script');
                        s.type = 'text/javascript'; s.async = true;
                        s.setAttribute('data-cfasync', 'false');
                        s.src = 'https://bancadeltempoidea.org/14/a293c499a899d218d75e263d1d1cf6db/invoke.js';
                        document.body.appendChild(s);
                    } catch(e){}
                }, 10000);
            } catch(e){}
        })();
    </script>
